services:
  - type: web
    name: modelcouncil-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BACKEND
        value: nim
      # Set these in Render's Environment tab — never commit secrets to git.
      - key: NVIDIA_API_KEY
        sync: false
      - key: COUNCIL_MODELS
        value: meta/llama-3.2-11b-vision-instruct,openai/gpt-oss-20b,nvidia/nemotron-3.5-lightning-30b-a3b
      - key: JUDGE_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NIM_BASE
        value: https://integrate.api.nvidia.com/v1
